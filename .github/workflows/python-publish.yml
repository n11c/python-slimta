name: publish

on:
  release:
    types: [ published ]

jobs:
  deploy:

    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.15'
    - name: Build
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
